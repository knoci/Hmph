[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "hmph"
version = "0.1.0"
description = "Local SQLite memory gateway for Project AIRI and MCP agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
keywords = [
  "ai-memory",
  "airi",
  "mcp",
  "sqlite",
  "long-term-memory",
  "companion",
  "rag",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
embeddings = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.19,<2",
  "tokenizers>=0.20,<1",
  "fastembed>=0.7,<1",
]
dev = [
  "ruff>=0.11,<1",
]

[project.scripts]
hmph = "hmph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hmph"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
