name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - run: python -m uv sync --frozen
      - run: docker compose up -d --wait db
      - run: python -m uv run ruff check .
      - run: python -m uv run ruff format --check .
      - run: python -m uv run pytest -q
      - run: python -m uv run hmph eval --suite evals/fixtures/longmemeval-smoke.json --output artifacts/evals/smoke.json
      - if: always()
        run: docker compose down
