name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint check
        run: ruff check .
      - name: Run unit & contract tests
        env:
          HMPH_DISABLE_LOCAL_ONNX: "1"
        run: pytest -q
      - name: Verify CLI entrypoint
        run: hmph --help && hmph airi-gateway --help
